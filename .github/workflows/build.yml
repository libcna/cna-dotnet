name: release-qualification

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # The CNA generation this binding is written against: ABI 0.47.0, the generation that retires CNA's
  # modern GPU layer (CNA plans/plan_modern_retirement.md MRT-012), on CNA's `next` branch -- its
  # integration branch; CNA `main` and `develop` still carry 0.46.0, which this binding refuses. Pin
  # it. A branch moves, and a header tree ahead of the reviewed matrix fails the ABI gates by design
  # -- which is the gates working, and not something to fix by tracking the branch. Every job that
  # reads CNA reads this commit, and native-qualified-linux-x64 builds its library from it.
  CNA_UPSTREAM_COMMIT: fbd8e64a3fde18beeb2861d546a279d90d0ed5bc
  # The generation the reviewed matrix accepted immediately before this one (0.46.0). The upstream
  # diff gate measures forward from here, which is what the ABI policy asks for.
  CNA_PREVIOUS_ACCEPTED_COMMIT: a3da0a5bbd58698d69b015ab4f79e647c4664eb7
  # The sibling checkouts CNA builds from (its ../sharp-runtime and ../easy-gl, and easy-gl's
  # ../meta-gl), pinned with it for native-qualified-linux-x64. CNA's configure refuses a sibling
  # whose declared version it does not support.
  SHARP_RUNTIME_COMMIT: 7805c5dc695d8e84abd45168ab218793e10a4ad3
  EASY_GL_COMMIT: f4d6afaf16cdc7e7e73130950bc45e6d865b41bd
  META_GL_COMMIT: dd3b30055d55fdc42240de7af248259338256992
  CNA_PACKAGE_VERSION: 0.1.0-ci.${{ github.run_number }}

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CNA.sln

  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CNA.sln
      - run: dotnet build CNA.sln -c Debug --no-restore -m:1

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CNA.sln
      - run: dotnet build CNA.sln -c Release --no-restore -m:1

  framework-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/CNA.Framework.Tests/CNA.Framework.Tests.csproj
      - run: dotnet test tests/CNA.Framework.Tests/CNA.Framework.Tests.csproj -c ${{ matrix.configuration }} --no-restore -m:1

  xna-compat-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/CNA.XnaCompat.Tests/CNA.XnaCompat.Tests.csproj
      - run: dotnet test tests/CNA.XnaCompat.Tests/CNA.XnaCompat.Tests.csproj -c ${{ matrix.configuration }} --no-restore -m:1

  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tests/CNA.XnaCompat.CompileProbe/CNA.XnaCompat.CompileProbe.csproj
      - run: dotnet build tests/CNA.XnaCompat.CompileProbe/CNA.XnaCompat.CompileProbe.csproj -c Release --no-restore -m:1

  leak-only-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # Both projects are built with --no-restore, so both are restored: the tool has no project
      # reference that would restore the library for it (AM4-257).
      - run: dotnet restore tools/api-compat/CNA.ApiCompat.csproj
      - run: dotnet restore src/CNA.XnaCompat/CNA.XnaCompat.csproj
      - run: dotnet build src/CNA.XnaCompat/CNA.XnaCompat.csproj -c Release --no-restore -m:1
      - run: dotnet build tools/api-compat/CNA.ApiCompat.csproj -c Release --no-restore -m:1
      - name: Require zero CNA public/protected leaks
        run: >-
          dotnet run --project tools/api-compat/CNA.ApiCompat.csproj -c Release --no-build --
          --leak-only --target src/CNA.XnaCompat/bin/Release/net8.0/CNA.XnaCompat.dll

  behavior-pure-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CNA.sln
      - run: dotnet build tests/CNA.XnaCompat.CompileProbe/CNA.XnaCompat.CompileProbe.csproj -c Release --no-restore -m:1
      - run: dotnet build tools/behavior-corpus/CNA.BehaviorCorpus.csproj -c Release --no-restore -m:1
      - run: dotnet run --project tools/behavior-corpus/CNA.BehaviorCorpus.csproj -c Release --no-build -- verify
      - run: dotnet run --project tests/CNA.XnaCompat.CompileProbe/CNA.XnaCompat.CompileProbe.csproj -c Release --no-build > /tmp/cna-pure.txt
      - run: >-
          dotnet run --project tools/behavior-corpus/CNA.BehaviorCorpus.csproj -c Release --no-build --
          validate --probe compile --input /tmp/cna-pure.txt
      - run: >-
          dotnet run --project tools/behavior-corpus/CNA.BehaviorCorpus.csproj -c Release --no-build --
          docs --output docs/generated/behavior-corpus.md --check

  portable-abi-header:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            report: linux-x64
          - os: windows-latest
            report: windows-x64
          # x86_64 macOS: macos-13 was retired on 2025-12-04 and a job naming it waits in the
          # queue for ever; macos-15-intel is GitHub's Intel image until fall 2027 (CNA
          # plans/plan_apple_m4.md AM4-288).
          - os: macos-15-intel
            report: osx-x64
          - os: macos-14
            report: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_UPSTREAM_COMMIT }}
          path: cna-upstream
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tools/abi-verify/CNA.AbiVerify.csproj
      - name: Verify C authority against managed ABI (Unix)
        if: runner.os != 'Windows'
        run: >-
          dotnet run --project tools/abi-verify/CNA.AbiVerify.csproj -c Release --
          --include cna-upstream/modules/c-api/include --output artifacts/abi/${{ matrix.report }}.json
      - name: Verify C authority against managed ABI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet run --project tools/abi-verify/CNA.AbiVerify.csproj -c Release --
          --include cna-upstream/modules/c-api/include --output artifacts/abi/${{ matrix.report }}.json
          --compiler clang
      - uses: actions/upload-artifact@v4
        with:
          name: abi-${{ matrix.report }}
          path: artifacts/abi/${{ matrix.report }}.json

  upstream-abi-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna
          path: cna-upstream
          fetch-depth: 0
      - name: Test the upstream diff's constant comparison
        run: python3 tools/coverage/test_baselinediff.py
      - name: Require a purely additive upstream diff over the consumed surface
        run: >-
          python3 tools/coverage/baselinediff.py
          --from "cna-upstream@${CNA_PREVIOUS_ACCEPTED_COMMIT}"
          --to "cna-upstream@${CNA_UPSTREAM_COMMIT}"
          --allowlist eng/cna-upstream-abi-allowlist.txt
          --json artifacts/abi/upstream-baseline-diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-abi-diff
          path: artifacts/abi/upstream-baseline-diff.json

  native-abi-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore tools/native-abi-probe/CNA.NativeAbiProbe.csproj
      - run: dotnet build tools/native-abi-probe/CNA.NativeAbiProbe.csproj -c Release --no-restore -m:1
      - name: Verify reviewed native ABI matrix, required symbols, signatures, and shapes
        run: >-
          scripts/Verify-NativeAbiCompatibility.sh --configuration Release --no-build
          --output artifacts/native-abi-policy
      - uses: actions/upload-artifact@v4
        with:
          name: native-abi-policy
          path: artifacts/native-abi-policy/abi-compatibility-report.json

  template-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The template branch named like this one when it exists, else its default branch: a change
      # made in both repositories is tested together, as CNA does for its siblings (AM4-262).
      - name: Choose the template branch
        id: template_branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/libcna/cna-dotnet-template.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna-dotnet-template
          ref: ${{ steps.template_branch.outputs.ref }}
          path: cna-dotnet-template
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify repository and generated project-reference modes
        env:
          CNA_DOTNET_ROOT: ${{ github.workspace }}
        run: cna-dotnet-template/scripts/verify-template.sh --mode development

  package-consumer-managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The template branch named like this one when it exists, else its default branch: a change
      # made in both repositories is tested together, as CNA does for its siblings (AM4-262).
      - name: Choose the template branch
        id: template_branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/libcna/cna-dotnet-template.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna-dotnet-template
          ref: ${{ steps.template_branch.outputs.ref }}
          path: cna-dotnet-template
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CNA.sln
      - run: dotnet pack src/CNA.Interop/CNA.Interop.csproj -c Release --no-restore -m:1 -p:CnaPackageAcceptance=true -p:CnaPackageVersion=${CNA_PACKAGE_VERSION} -o /tmp/cna-feed
      - run: dotnet pack src/CNA.Framework/CNA.Framework.csproj -c Release --no-restore -m:1 -p:CnaPackageAcceptance=true -p:CnaPackageVersion=${CNA_PACKAGE_VERSION} -o /tmp/cna-feed
      - run: dotnet pack src/CNA.XnaCompat/CNA.XnaCompat.csproj -c Release --no-restore -m:1 -p:CnaPackageAcceptance=true -p:CnaPackageVersion=${CNA_PACKAGE_VERSION} -o /tmp/cna-feed
      - name: Verify generated package consumer without source paths
        env:
          CNA_DOTNET_ROOT: ${{ github.workspace }}
        run: >-
          cna-dotnet-template/scripts/verify-template.sh --mode package
          --package-feed /tmp/cna-feed --package-version ${CNA_PACKAGE_VERSION}

  strict-api:
    if: vars.XNA_REFERENCE_ARTIFACT_CONFIGURED == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Materialize protected, legally supplied XNA references
        shell: pwsh
        env:
          XNA_REFERENCE_ARCHIVE_BASE64: ${{ secrets.XNA_REFERENCE_ARCHIVE_BASE64 }}
        run: |
          if (-not $env:XNA_REFERENCE_ARCHIVE_BASE64) { throw "Protected XNA reference archive is configured but empty." }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\xna-references.zip", [Convert]::FromBase64String($env:XNA_REFERENCE_ARCHIVE_BASE64))
          Expand-Archive "$env:RUNNER_TEMP\xna-references.zip" "$env:RUNNER_TEMP\xna-references"
      - run: dotnet restore CNA.sln
      - run: dotnet build src/CNA.XnaCompat/CNA.XnaCompat.csproj -c Release --no-restore -m:1
      - run: dotnet build tools/api-compat/CNA.ApiCompat.csproj -c Release --no-restore -m:1
      - name: Require exact 256-type, zero-diagnostic contract
        shell: pwsh
        run: >-
          dotnet run --project tools/api-compat/CNA.ApiCompat.csproj -c Release --no-build --
          --reference-dir "$env:RUNNER_TEMP\xna-references"
          --target src/CNA.XnaCompat/bin/Release/net8.0/CNA.XnaCompat.dll --format github
      - name: Require exact GamerServices, Avatar and Net contract (75 types)
        shell: pwsh
        run: >-
          dotnet run --project tools/api-compat/CNA.ApiCompat.csproj -c Release --no-build --
          --reference-dir "$env:RUNNER_TEMP\xna-references"
          --profile tools/api-compat/profiles/xna40-gamerservices-net.json
          --target src/CNA.XnaCompat/bin/Release/net8.0/CNA.XnaCompat.dll --format github
      - run: dotnet build tools/xna-assemblies/CNA.XnaAssemblies.csproj -c Release --no-restore -m:1
      - name: Require XNA-named assemblies forwarding every XNA 4.0 public type
        shell: pwsh
        run: >-
          dotnet run --project tools/xna-assemblies/CNA.XnaAssemblies.csproj -c Release --no-build --
          --xna "$env:RUNNER_TEMP\xna-references"
          --facade src/CNA.XnaCompat/bin/Release/net8.0/CNA.XnaCompat.dll

  strict-api-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report legal reference configuration
        run: |
          if [[ "${{ vars.XNA_REFERENCE_ARTIFACT_CONFIGURED }}" == "true" ]]; then
            echo "WINDOWS_XNA_STRICT_STATUS=configured; see strict-api job"
          else
            echo "WINDOWS_XNA_STRICT_STATUS=not-configured (protected legal reference archive is absent)"
          fi

  # Builds the pinned CNA's C API from source and runs the native suites against that library, so
  # every run of this workflow loads a native CNA of exactly CNA_UPSTREAM_COMMIT. Until 2026-10-13 the
  # job decoded a library from a secret behind a repository variable that was never set: it was
  # skipped in all 40 runs that had it, so no run of this workflow had loaded a native library.
  native-qualified-linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CC: gcc-14
      CXX: g++-14
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      # The template branch named like this one when it exists, else its default branch: a change
      # made in both repositories is tested together, as CNA does for its siblings (AM4-262).
      - name: Choose the template branch
        id: template_branch
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/libcna/cna-dotnet-template.git "$branch" >/dev/null 2>&1; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna-dotnet-template
          ref: ${{ steps.template_branch.outputs.ref }}
          path: cna-dotnet-template
      # CNA beside its siblings, as a developer's tree has them. Top-level submodules only, as CNA's
      # own CI checks it out: SDL is one, and CNA builds no codec behind SDL_mixer's nested ones.
      - uses: actions/checkout@v4
        with:
          repository: libcna/cna
          ref: ${{ env.CNA_UPSTREAM_COMMIT }}
          path: native/cna
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ env.SHARP_RUNTIME_COMMIT }}
          path: native/sharp-runtime
      - uses: actions/checkout@v4
        with:
          repository: libcna/easy-gl
          ref: ${{ env.EASY_GL_COMMIT }}
          path: native/easy-gl
      - uses: actions/checkout@v4
        with:
          repository: libcna/meta-gl
          ref: ${{ env.META_GL_COMMIT }}
          path: native/meta-gl
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install CNA's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 cmake ninja-build ccache pkg-config xvfb \
            libcurl4-openssl-dev nlohmann-json3-dev libfreetype-dev zlib1g-dev libopus-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - name: Record the SDL submodule commit
        id: sdl
        run: echo "sha=$(git -C native/cna/third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache the SDL build CNA makes from its submodule
        uses: actions/cache@v4
        with:
          path: native/cna/.sdl-prebuilt-Linux-x86_64
          key: cna-sdl-linux-x64-${{ steps.sdl.outputs.sha }}
      - name: Cache compiler output
        uses: actions/cache@v4
        with:
          path: .ccache
          key: cna-native-ccache-linux-x64-${{ env.CNA_UPSTREAM_COMMIT }}
          restore-keys: cna-native-ccache-linux-x64-
      # The qualified Linux configuration (docs/migrating-xna-games.md): OPENGLES3 with compiled
      # effects, and every C API family built rather than refused. Installed as the CNACApi
      # component, the layout a package carries: the library with RUNPATH $ORIGIN and SDL beside it.
      # Without CNA's static archive, which the component would otherwise install and this binding
      # does not load.
      - name: Build and install the pinned CNA C API
        run: |
          cmake -S native/cna -B native/cna/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCNA_GRAPHICS_RENDERER=OPENGLES3 \
            -DCNA_BUILD_C_API=ON \
            -DCNA_C_API_BUILD_STATIC=OFF \
            -DCNA_CNAEXT=ON \
            -DCNA_DEVICES=ON \
            -DCNA_EASYGL_COMPILED_EFFECTS=ON \
            -DCNA_ENABLE_DRACO=ON \
            -DCNA_ENABLE_VIDEO=ON \
            -DCNA_ENABLE_VOICE=ON \
            -DCNA_BUILD_TESTS=OFF \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build native/cna/build --target cna_c_api --parallel 4
          cmake --install native/cna/build --component CNACApi --prefix "$RUNNER_TEMP/cna-native"
          ccache --show-stats
          echo "CNA_NATIVE_LIBRARY=$RUNNER_TEMP/cna-native/lib/libcna_c_api.so" >> "$GITHUB_ENV"
      # Admission before evidence: the library is the exact reviewed generation, exports every entry
      # point CNA.Interop imports and passes the runtime canaries, or no test runs against it.
      - name: Require the built library to be the admitted ABI generation
        run: |
          scripts/Verify-NativeAbiCompatibility.sh --configuration Release \
            --native-library "$CNA_NATIVE_LIBRARY" --output "$RUNNER_TEMP/native-abi"
          version=$(python3 -c 'import ctypes, os; v = ctypes.CDLL(os.environ["CNA_NATIVE_LIBRARY"]).cna_get_abi_version(); print(f"{v >> 16}.{(v >> 8) & 0xFF}.{v & 0xFF}")')
          consumer=$(jq -r .consumerAbi eng/cna-native-abi-policy.json)
          echo "CNA_NATIVE_LINUX_X64=CNA ${CNA_UPSTREAM_COMMIT} ABI ${version} (consumer ${consumer})"
          test "$version" = "$consumer"
          echo "Native library under test: CNA \`${CNA_UPSTREAM_COMMIT}\`, C ABI ${version}, built in this run." >> "$GITHUB_STEP_SUMMARY"
      - run: dotnet restore CNA.sln
      - run: dotnet build CNA.sln -c Debug --no-restore -m:1
      - run: dotnet build CNA.sln -c Release --no-restore -m:1
      - name: Native integration Debug
        run: xvfb-run -a dotnet test tests/CNA.Integration.Tests/CNA.Integration.Tests.csproj -c Debug --no-build -m:1
      - name: Native integration Release
        run: xvfb-run -a dotnet test tests/CNA.Integration.Tests/CNA.Integration.Tests.csproj -c Release --no-build -m:1
      - name: GamerServices integration Release (own process; runsettings isolate the keyring)
        run: xvfb-run -a dotnet test tests/CNA.GamerServices.IntegrationTests/CNA.GamerServices.IntegrationTests.csproj -c Release --no-build -m:1
      - name: Ownership 100 cycles Debug and Release
        env:
          CNA_OWNERSHIP_STRESS_FAMILY: all
          SDL_VIDEODRIVER: offscreen
        run: |
          dotnet run --project tests/CNA.OwnershipStress/CNA.OwnershipStress.csproj -c Debug --no-build -- 100
          dotnet run --project tests/CNA.OwnershipStress/CNA.OwnershipStress.csproj -c Release --no-build -- 100
      - name: Full CNA behavior corpus
        env:
          SDL_VIDEODRIVER: offscreen
        run: scripts/Capture-CnaSnapshots.sh --output "$RUNNER_TEMP/cna-snapshots" --force
      - name: Local package/RID acceptance (never publishes)
        env:
          CNA_TEMPLATE_ROOT: ${{ github.workspace }}/cna-dotnet-template
        run: >-
          scripts/Package-Acceptance.sh --native-directory "$RUNNER_TEMP/cna-native/lib"
          --package-version "${CNA_PACKAGE_VERSION}" --output "$RUNNER_TEMP/package-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x64-local-qualification
          path: |
            ${{ runner.temp }}/native-abi/abi-compatibility-report.json
            ${{ runner.temp }}/cna-snapshots
            ${{ runner.temp }}/package-acceptance/acceptance-report.json
